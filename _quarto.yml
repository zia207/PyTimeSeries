          - href: notebooks/part-12-deployment-capstone.ipynb
            text: "12 · Deployment & Capstone"
  page-footer:
    center: "Time Series Analysis in Python · a 12-part tutorial"

format:
  html:
    theme:
      light: cosmo
    toc: true
    toc-depth: 3
    toc-location: right
    code-fold: false
    code-tools: true
    code-copy: true
    highlight-style: github
    fig-align: center
    smooth-scroll: true
    css: styles.css
